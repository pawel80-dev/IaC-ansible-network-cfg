- name: Basic API call
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Call local Cisco ISE API
      ansible.builtin.uri:
        url: "https://10.12.0.98:9060/ers/config/networkdevice"
        user: "ersadmin"
        password: "Cisco123"
        method: GET
        return_content: true
        validate_certs: no
        headers:
          Accept: application/json
          User-Agent: Ansible-Playbook
      register: ise_response

    - name: Device API call
      ansible.builtin.uri:
        url: "https://10.12.0.98:9060/ers/config/networkdevice/name/RT2_IOSv"
        user: "ersadmin"
        password: "Cisco123"
        method: GET
        return_content: true
        validate_certs: no
        headers:
          Accept: application/json
          User-Agent: Ansible-Playbook
      register: ise_device_response

    - name: Show response status
      ansible.builtin.debug:
        msg: 
          General response status: "{{ ise_response.status }}"
          Device response status: "{{ ise_device_response.status }}"

